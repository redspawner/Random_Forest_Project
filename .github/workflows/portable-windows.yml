# Builds the portable Windows bundles (English and Portuguese; no installation needed on the
# target PC), tests them on a clean Windows machine, and publishes them as downloadable artifacts.
name: Portable Windows bundle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            folder: GreyZoneTriage
            zip: GreyZoneTriage_portable_win64
            ready: "The app is ready"
          - lang: pt
            folder: TriagemZonaCinzenta
            zip: TriagemZonaCinzenta_portatil_win64
            ready: "pronta"
    steps:
      - uses: actions/checkout@v4

      - name: Python used only to run the builder
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the bundle
        run: python tools/build_portable.py --lang ${{ matrix.lang }}

      - name: Test - libraries import with the bundled Python
        working-directory: dist/${{ matrix.folder }}/app
        run: ..\python\python.exe -c "import numpy, pandas, scipy, sklearn, streamlit, openpyxl, yaml, matplotlib; print('imports OK', sklearn.__version__)"

      - name: Test - every shipped model (RF, LR, GB, ...) loads without re-training
        working-directory: dist/${{ matrix.folder }}/app
        run: |
          ..\python\python.exe -c "from greyzone_rf.default_model import default_status as s, shipped_types as t; from greyzone_rf.config import load_config as c; rs={k: s(c(), k) for k in t(c())}; [print(k, r['loadable'], r['dataset_matches'], r['error']) for k, r in rs.items()]; assert all(r['loadable'] and r['dataset_matches'] for r in rs.values())"

      - name: Test - classify the example patients with the Logistic Regression and the Gradient Boosting
        working-directory: dist/${{ matrix.folder }}/app
        run: |
          ..\python\python.exe predict.py examples\example_2_new_patients_file.xlsx --model models\default_logistic_regression --out $env:RUNNER_TEMP\results_lr.xlsx
          ..\python\python.exe predict.py examples\example_2_new_patients_file.xlsx --model models\default_gradient_boosting --out $env:RUNNER_TEMP\results_gb.xlsx

      - name: Test - classify the example patients
        working-directory: dist/${{ matrix.folder }}/app
        run: ..\python\python.exe predict.py examples\example_2_new_patients_file.xlsx --out $env:RUNNER_TEMP\results.xlsx

      - name: Test - training works (parallel worker processes)
        working-directory: dist/${{ matrix.folder }}/app
        run: ..\python\python.exe train.py examples\example_1_training_file.xlsx --out $env:RUNNER_TEMP\model --no-nested

      - name: Test - the launcher (as START_APP.bat) starts the app and reports it ready
        working-directory: dist/${{ matrix.folder }}/app
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\launcher.log"
          $p = Start-Process -FilePath ..\python\python.exe -ArgumentList "-u","run_app.py","--no-browser" -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "${{ matrix.ready }}" -Quiet)) { $ok = $true; break }
          }
          Get-Content $log
          if ($ok) {
            $url = (Select-String -Path $log -Pattern "http://127\.0\.0\.1:\d+").Matches[0].Value
            $health = (Invoke-WebRequest -UseBasicParsing "$url/_stcore/health").Content
            "health: $health"
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "streamlit" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$log.err"; throw "The app did not become ready" }
          if ($health -notmatch "ok") { throw "Health check failed" }

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}.zip
          retention-days: 30
          compression-level: 0
